# PostgreSQL untuk development multi-proses / paritas produksi.
# Jalankan:  docker compose -f docker-compose.dev.yml up -d
# Lalu set di .env.local:
#   DATABASE_URL=postgres://perumnet:perumnet@localhost:5432/perumnet
# Tanpa ini aplikasi memakai PGlite (./data/pglite) — cukup untuk 1 proses.

# WAJIB: nama proyek dikunci di sini, JANGAN dihapus.
# Tanpa baris ini Compose menurunkan nama proyek dari nama folder, sehingga
# mengganti nama folder membuat Compose membuat volume BARU yang kosong —
# database naik seolah-olah datanya hilang. Sudah pernah terjadi: volume
# "prtgperumnet_perumnet-pgdata" adalah sisa dari waktu folder ini masih
# bernama "PRTG PerumNet". Volume yang benar dan berisi data:
#   monitoringnoc-perumnet_perumnet-pgdata
# Container ini juga dipakai PerumNet CRM lewat localhost:5433.
name: monitoringnoc-perumnet

services:
  postgres:
    image: postgres:16-alpine
    container_name: perumnet-postgres
    environment:
      POSTGRES_USER: perumnet
      POSTGRES_PASSWORD: perumnet
      POSTGRES_DB: perumnet
    ports:
      # 5433 (bukan 5432) agar tidak bentrok dengan Postgres lain di mesin
      # dev (mis. perumnet-warehouse). Set DATABASE_URL sesuai port ini.
      - "5433:5432"
    volumes:
      - perumnet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perumnet -d perumnet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  perumnet-pgdata:
